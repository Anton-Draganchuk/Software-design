services:
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      JMXPORT: 7071
      JMXHOST: 0.0.0.0
    ports:
      - "2181:2181"

  service1:
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    container_name: service1
    depends_on:
      - zookeeper
    environment:
      SPRING_APPLICATION_NAME: service1
      SERVER_PORT: 8080
      PROVIDER_HOST: service1
      SERVICE_REGISTRY_CONNECT_STRING: zookeeper:2181
    ports:
      - "8080:8080"

  service2:
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    container_name: service2
    depends_on:
      - zookeeper
    environment:
      SPRING_APPLICATION_NAME: service2
      SERVER_PORT: 8082
      PROVIDER_HOST: service2
      SERVICE_REGISTRY_CONNECT_STRING: zookeeper:2181
    ports:
      - "8082:8082"

  client:
    build:
      context: .
      dockerfile: rate-printer/Dockerfile
    container_name: client
    depends_on:
      - zookeeper
      - service1
      - service2
    environment:
      SPRING_APPLICATION_NAME: client
      SERVER_PORT: 8081
      RATE_PRINTER_CLIENT_NAME: client
      SERVICE_REGISTRY_CONNECT_STRING: zookeeper:2181
    ports:
      - "8081:8081"

  zookeeper-jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:latest
    container_name: zookeeper-jmx-exporter
    depends_on:
      - zookeeper
    command: ["9404", "/config/zookeeper.yml"]
    volumes:
      - ./monitoring/jmx/zookeeper.yml:/config/zookeeper.yml:ro
    ports:
      - "9404:9404"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - client
      - service1
      - service2
      - zookeeper-jmx-exporter
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  pact-broker-db:
    image: postgres:16-alpine
    container_name: pact-broker-db
    environment:
      POSTGRES_DB: pactbroker
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactbroker -d pactbroker"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pact-broker-db-data:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pactbroker:pactbroker@pact-broker-db:5432/pactbroker
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_SQL_LOG_LEVEL: WARN
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: 10
    ports:
      - "9292:9292"

volumes:
  pact-broker-db-data:
