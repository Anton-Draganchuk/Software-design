services:
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      JMXPORT: 7071
      JMXHOST: 0.0.0.0
    stop_grace_period: 20s
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  service1:
    image: ${SERVICE1_IMAGE:-software-design-service1}:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
      args:
        APP_JAR: currency-rate-provider/target/currency-rate-provider-${APP_VERSION:-1.0.0}.jar
    container_name: service1
    depends_on:
      - zookeeper
    environment:
      SPRING_APPLICATION_NAME: service1
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      PROVIDER_HOST: service1
      SERVICE_REGISTRY_CONNECT_STRING: ${SERVICE_REGISTRY_CONNECT_STRING:-zookeeper:2181}
    stop_grace_period: 20s
    ports:
      - "${SERVICE1_PORT:-8080}:8080"

  service2:
    image: ${SERVICE2_IMAGE:-software-design-service2}:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
      args:
        APP_JAR: currency-rate-provider/target/currency-rate-provider-${APP_VERSION:-1.0.0}.jar
    container_name: service2
    depends_on:
      - zookeeper
    environment:
      SPRING_APPLICATION_NAME: service2
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8082
      PROVIDER_HOST: service2
      SERVICE_REGISTRY_CONNECT_STRING: ${SERVICE_REGISTRY_CONNECT_STRING:-zookeeper:2181}
    stop_grace_period: 20s
    ports:
      - "${SERVICE2_PORT:-8082}:8082"

  client:
    image: ${CLIENT_IMAGE:-software-design-client}:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: rate-printer/Dockerfile
      args:
        APP_JAR: rate-printer/target/rate-printer-${APP_VERSION:-1.0.0}.jar
    container_name: client
    depends_on:
      - zookeeper
      - service1
      - service2
    environment:
      SPRING_APPLICATION_NAME: client
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      RATE_PRINTER_CLIENT_NAME: client
      SERVICE_REGISTRY_CONNECT_STRING: ${SERVICE_REGISTRY_CONNECT_STRING:-zookeeper:2181}
    stop_grace_period: 20s
    ports:
      - "${CLIENT_PORT:-8081}:8081"

  zookeeper-jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:latest
    container_name: zookeeper-jmx-exporter
    depends_on:
      - zookeeper
    environment:
      SERVICE_PORT: 9404
      CONFIG_YML: /config/zookeeper.yml
    stop_grace_period: 20s
    volumes:
      - ./monitoring/jmx/zookeeper.yml:/config/zookeeper.yml:ro
    ports:
      - "${ZOOKEEPER_EXPORTER_PORT:-9404}:9404"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - client
      - service1
      - service2
      - zookeeper-jmx-exporter
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    stop_grace_period: 20s
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    stop_grace_period: 20s
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  pact-broker-db:
    image: postgres:16-alpine
    container_name: pact-broker-db
    environment:
      POSTGRES_DB: pactbroker
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactbroker -d pactbroker"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 20s
    volumes:
      - pact-broker-db-data:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pactbroker:pactbroker@pact-broker-db:5432/pactbroker
      PACT_BROKER_BASE_URL: http://localhost:${PACT_BROKER_PORT:-9292}
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_SQL_LOG_LEVEL: WARN
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: 10
    stop_grace_period: 20s
    ports:
      - "${PACT_BROKER_PORT:-9292}:9292"

volumes:
  pact-broker-db-data:
