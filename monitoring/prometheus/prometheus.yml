global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: service1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service1:8080"]

  - job_name: service2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service2:8082"]

  - job_name: client
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["client:8081"]

  - job_name: zookeeper
    static_configs:
      - targets: ["zookeeper-jmx-exporter:9404"]
